<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">

    <title>Admin Login - University Management System</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-image: url('https://th.bing.com/th/id/R.5bf78762f084edcc74be63a5a459f62a?rik=aXJIwoRV04r0zA&riu=http%3a%2f%2fwww.gptccbe.co.in%2fthumbs%2fbanner%2fs3.jpg&ehk=SlNZwvLbPl9GoTHkyNtGMlEPm%2b32Vkw4jB%2fwgLf9IPA%3d&risl=&pid=ImgRaw&r=0');
            background-size: cover;
            font-family: 'Roboto', sans-serif;
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .navbar {
        width: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    .navbar .title {
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-align: left;
    }

    .navbar h5 {
        font-size: 14px;
        margin: 5px 0 0;
        font-weight: normal;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s, color 0.3s;
    }

    .navbar a:hover {
        background-color: #3867d6;
        color: white;
    }

    .navbar a.active {
        font-weight: bold;
        color: #ff5e62;
        text-decoration: underline;
        background-color: rgba(255, 255, 255, 0.2);
    }

    .login-form {
    background-color: rgba(255, 255, 255, 0.05); /* Dark transparent background */
    padding: 50px;
    border-radius: 15px;
    width: 350px;
    text-align: center;
    box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.4); /* More intense shadow */
    backdrop-filter: blur(10px); /* Subtle background blur effect */
}

/* Title with gradient text and glowing effect */
.login-form h2 {
    color: #fff;
    font-size: 32px;
    margin-bottom: 30px;
    background: linear-gradient(45deg, #121212, #333134); /* Gradient colors */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(19, 19, 19, 0.6), 0 0 20px rgba(38, 37, 39, 0.4); /* Glowing effect */
}

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            width: 100%;
            font-size: 18px;
            padding: 10px;
            background-color: #4b7bec;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #3867d6;
        }

        .image-container {
            margin-top: 50px;
        }

        .image-container img {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="title">Tamizha University <br> <h5>Coimbatore, Tamilnadu,India</h5></div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('admin_page') }}">Admin</a>
            <a href="{{ url_for('student_page') }}">Student</a>
        </div>
    </nav>

    <div class="login-form">
        <h2>Student Login</h2>
        <form action="{{url_for('student_page')}}" method="POST" id="loginForm">
            <div class="form-group">
                <input type="text" class="form-control" placeholder="Username" name="username" id="username" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="password" name="roll_no" id="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        {% if message %}
            <p style="color: red;">{{ message }}</p>
        {% endif %}
    </div>    
  

</body>
</html>
