<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-image: url('https://th.bing.com/th/id/R.5bf78762f084edcc74be63a5a459f62a?rik=aXJIwoRV04r0zA&riu=http%3a%2f%2fwww.gptccbe.co.in%2fthumbs%2fbanner%2fs3.jpg&ehk=SlNZwvLbPl9GoTHkyNtGMlEPm%2b32Vkw4jB%2fwgLf9IPA%3d&risl=&pid=ImgRaw&r=0');
            background-size: cover;
            background-position: center;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .navbar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .navbar .title {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar h5 {
            font-size: 14px;
            margin: 5px 0 0;
            font-weight: normal;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .navbar a:hover {
            background-color: #3867d6;
            color: white;
        }

        .navbar a.active {
            font-weight: bold;
            color: #ff5e62;
            text-decoration: underline;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .container {
            margin-top: 80px;
        }

        .login-form {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .login-form h2 {
            color: #fff;
            font-size: 32px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #121212, #333134);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(19, 19, 19, 0.6), 0 0 20px rgba(38, 37, 39, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            color: #fff;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            width: 100%;
            font-size: 18px;
            padding: 10px;
            background-color: #4b7bec;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #3867d6;
        }

        .flash-message {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: rgba(255, 0, 0, 0.7);
            color: #fff;
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="title">
            Tamizha University
            <br>
            <h5>Coimbatore, Tamil Nadu, India</h5>
        </div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#">Admin</a>
        </div>
    </nav>

    <div class="container">
        <div class="login-form">
            <h2>Teacher Login</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-message {{ messages[0][1] }}">
                    {{ messages[0][0] }}
                </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('teacher_login') }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
