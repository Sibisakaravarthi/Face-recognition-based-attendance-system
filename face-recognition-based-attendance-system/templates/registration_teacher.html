<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body{
            background-image: url('https://www.tamiluniversity.ac.in/english/wp-content/themes/tamil_university/img/banner-6.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Navbar styles */
        .navbar {
            background-color: rgba(0, 0, 0, 0.933);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .navbar .title {
            color: rgb(250, 246, 246);
            font-size: 22px;
            font-weight: bold;
            text-align: left;
        }

        .navbar h5 {
            font-size: 12px;
            font-weight: normal;
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 16px;
            margin-left: 15px;
            transition: background-color 0.3s, color 0.3s;
        }

        .navbar a:hover {
            background-color: #3867d6;
            color: white;
        }

        /* Flash Message Styling */
        .flash-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .flash-message.error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .flash-message.success {
            background-color: #d4edda;
            color: #155724;
        }

        /* Form container styles */
        .container {
            margin-top: 120px;
            width: 50%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: rgba(46, 45, 45, 0.025);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h2 {
            color: #fff;
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            background: linear-gradient(45deg, #0b0b0b, #131313);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(17, 16, 16, 0.6), 0 0 30px rgb(251, 250, 250);
        }

        /* Form fields */
        .form-group {
            margin-bottom: 25px;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #323232;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: all 0.3s ease-in-out;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            border-color: #222121;
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Button styling */
        /* Button styling */
button {
    width: 50%; /* Set the button width to 50% */
    padding: 12px 18px;
    font-size: 18px;
    border-radius: 10px;
    background-color: #121212;
    color: #fff;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease-in-out;
    display: block; /* Ensures block-level styling */
    margin-left: auto;  /* Center the button horizontally */
    margin-right: auto; /* Center the button horizontally */
}

button:hover {
    background-color: #191819;
}

button:active {
    background-color: #121212;
}


        /* Responsive design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar a {
                margin: 5px 0;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="title">
                Tamizha University <br> <h5>Coimbatore, Tamilnadu, India</h5>
            </div>
            <div>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('listusers') }}">List Students</a>
                <a href="{{ url_for('register_teacher') }}" class="active">Teacher Registration</a>
                <a href="{{ url_for('register_subject') }}">Subject Registration</a>
            </div>
        </nav>

        <!-- Flash message -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-message {{ category }}" style="color: #155724;">
                {{ messages[0][0] }}
            </div>
        {% endif %}
        {% endwith %}

        <!-- Teacher Registration Form -->
        <div class="form-container">
            <h2>Register Teacher</h2>
            <form action="/register_teacher" method="POST">
                <div class="form-group">
                    <label for="teacher_name" class="form-label">Teacher Name</label>
                    <input type="text" class="form-control" id="teacher_name" name="teacher_name" required>
                </div>
                <div class="form-group">
                    <label for="teacher_email" class="form-label">Teacher Email</label>
                    <input type="email" class="form-control" id="teacher_email" name="teacher_email" required>
                </div>
                <div class="form-group">
                    <label for="teacher_phone" class="form-label">Teacher Phone Number</label>
                    <input type="text" class="form-control" id="teacher_phone" name="teacher_phone">
                </div>
                <div class="form-group">
                    <label for="teacher_department" class="form-label">Teacher Department</label>
                    <input type="text" class="form-control" id="teacher_department" name="teacher_department">
                </div>
                <div class="form-group">
                    <label for="teacher_password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="teacher_password" name="teacher_password" required>
                </div>                
                <button type="submit" class="btn btn-primary">Register Teacher</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
