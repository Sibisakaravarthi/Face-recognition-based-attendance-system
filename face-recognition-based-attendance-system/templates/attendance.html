<!doctype html>
<html lang="en">

<style type='text/css'>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Roboto', sans-serif;
    }

    body {
        background-image: url('https://www.tamiluniversity.ac.in/english/wp-content/themes/tamil_university/img/banner-7.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 2s ease-in-out;
    }

    .navbar {
        width: 100%;
        background-color: rgba(0, 0, 0, 0.933);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    .navbar .title {
        color: rgb(250, 246, 246);
        font-size: 24px;
        font-weight: bold;
        text-align: left;
    }

    .navbar h5 {
        font-size: 14px;
        margin: 5px 0 0;
        font-weight: normal;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s, color 0.3s;
    }

    .navbar a:hover {
        background-color: #3867d6;
        color: white;
    }

    .navbar a.active {
        font-weight: bold;
        color: #ff5e62;
        text-decoration: underline;
        background-color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    .mt-3 {
        margin-top: 100px;
        text-align: center;
    }

    h1 {
    font-size: 56px;
    text-align: center;
    -webkit-background-clip: text; /* Clips the gradient to the text */
    color: transparent; /* Makes text transparent to show gradient */
    position: relative;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 5px; /* Increased space between letters */
    padding: 10px 20px;
    overflow: hidden;
    border-radius: 10px;
    color: #fff;
    text-shadow: 0 0 20px #ff6f61, 0 0 30px #ff6f61, 0 0 40px #ff6f61, 0 0 50px #ff9f80; /* Glowing effect */
 /* Gradient background */
}

h1::before {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    color: #fff;
    text-shadow: 0 0 20px #ff6f61, 0 0 30px #ff6f61, 0 0 40px #ff6f61, 0 0 50px #ff9f80; /* Glowing effect */
    -webkit-background-clip: text;
    z-index: -1;
    border-radius: 10px;
    
}

h1:hover, .h1-active {
    animation: none; /* Stops animation on hover */
    color: #fff; /* Solid white color when hovered */
    text-shadow: 0 0 20px #ff6f61, 0 0 30px #ff6f61, 0 0 40px #ff6f61, 0 0 50px #ff9f80; /* Glowing effect */
}

/* Neon glowing pulse animation */
@keyframes neonPulse {
    0% {
        text-shadow: 0 0 5px #ff6f61, 0 0 10px #ff6f61, 0 0 15px #ff6f61, 0 0 20px #ff9f80;
    }
    50% {
        text-shadow: 0 0 10px #ff6f61, 0 0 20px #ff6f61, 0 0 30px #ff6f61, 0 0 40px #ff9f80;
    }
    100% {
        text-shadow: 0 0 5px #ff6f61, 0 0 10px #ff6f61, 0 0 15px #ff6f61, 0 0 20px #ff9f80;
    }
}

    table {
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 10px;
        overflow: hidden;
    }

    table th, table td {
        padding: 12px 15px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
    }

    table th {
        background-color: rgba(0, 0, 0, 0.6);
        font-weight: bold;
    }

    table tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.05);
    }

    table tr:hover {
        background-color: rgba(255, 255, 255, 0.2);
    }

    .col {
        background-color: rgba(0, 0, 0, 0.7);
        border-radius: 15px;
        padding: 20px;
        margin: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        color: white;
        flex: 1;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: bold;
    }

    input[type="text"], input[type="number"] {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        margin-bottom: 20px;
        border-radius: 5px;
        border: none;
        outline: none;
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
        transition: background-color 0.3s, border-color 0.3s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
        background-color: rgba(255, 255, 255, 0.4);
        border: 2px solid #3867d6;
    }

    .btn {
        display: inline-block;
        padding: 10px 20px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        color: white;
        background-color: #4b7bec;
        transition: background-color 0.3s ease;
    }

    .btn:hover {
        background-color: #3867d6;
    }

    .btn-danger {
        background-color: #eb3b5a;
    }

    .btn-danger:hover {
        background-color: #d8344a;
    }

    @media (max-width: 768px) {
        .navbar {
            flex-direction: column;
            align-items: flex-start;
        }

        .navbar .title {
            font-size: 20px;
        }

        .col {
            padding: 15px;
            margin: 10px 0;
        }

        h1 {
            font-size: 28px;
        }
    }
</style>

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">

    <title>Attendance</title>
</head>

<body>
    <nav class="navbar">
        <div class="title">Tamilzha University <br> <h5>Coimbatore, Tamilnadu,India</h5></div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('admin_page') }}">Admin</a>
            <a href="{{ url_for('listusers') }}">List Students</a>
            <a href="{{ url_for('register_teacher') }}">Teacher Registration</a>
            <a href="{{ url_for('register_subject') }}">Subject Registration</a>
            <a href="{{ url_for('student_page') }}">Student</a>
        </div>
    </nav>
    
    <div class='mt-3 text-center'>
        <h1 style="width: auto;margin: auto;padding: 11px;font-size: 44px;">Attendance for Students</h1>
    </div>

    {% if mess%}
    <p class="text-center" style="color: red;font-size: 20px;">{{ mess }}</p>
    {% endif %}

    <div class="row text-center" style="padding: 20px;margin: 20px;">

        <div class="col">
            <div class="col">
                <h2>Today's Attendance <i class="material-icons">assignment</i></h2>
            </div>
            <form action="/start" method="POST">
                <div class="mb-3">
                    <label for="subject_id" class="form-label">Select Subject</label>
                    
                    <select class="form-control text-dark" id="subject_id" name="subject_id" required>
                        <option value="">Select Subject</option>
                        {% for subject in subjects %}
                            <option value="{{ subject[0] }}">{{ subject[1] }}</option>
                        {% endfor %}
                    </select>
            
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">
                            Take Attendance <i class="material-icons">beenhere</i>
                        </button>
                        <br>
                        <a href="/stop" class="btn btn-danger">
                            Stop Attendance <i class="material-icons">stop</i>
                        </a>
                    </div>
                </div>
            </form>                        
        </div>
        <div class="col">
            <form action='/add' method="POST" enctype="multipart/form-data">
                <h2>Add New Student <i class="material-icons">control_point_duplicate</i></h2>
                <label><b>Enter New Student Name*</b></label>
                <input type="text" id="newusername" name='newusername' required>
                <label><b>Enter New Student Id*</b></label>
                <input type="number" id="newusereid" name='newuserid' required>
                <button type='submit' class='btn btn-dark'>Add New User</button>

            </form>
        </div>

    </div>

</body>

</html>
